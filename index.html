<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alfred Tennyson — Portfolio 2026</title>
  <style>
/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  overscroll-behavior: none;       /* no bounce / rubber-band at the top and bottom */
  background: #0F0E0E;
}

body {
  margin: 0;
  overscroll-behavior: none;
  background: #0F0E0E;
  -webkit-text-size-adjust: 100%;
}

/* ---------- Images stacked edge to edge, no gaps ---------- */
section {
  width: 100%;
  margin: 0;
  padding: 0;
  line-height: 0;                 /* removes the tiny gap browsers leave under images */
}

section img {
  display: block;
  width: 100%;
  height: auto;                   /* each image keeps its own proportions */
  aspect-ratio: 16 / 9;           /* reserves space while loading so the page doesn't jump */
  user-select: none;
  -webkit-user-drag: none;
}

/* ---------- Footer ---------- */
.site-footer {
  background: #fff;
  color: #000;
  padding: clamp(24px, 5vw, 64px) clamp(20px, 4vw, 64px);
  padding-bottom: calc(clamp(24px, 5vw, 64px) + env(safe-area-inset-bottom, 0px));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
}

.footer-links {
  grid-column: 2;                 /* keeps the circles centred */
  display: flex;
  gap: clamp(14px, 2.4vw, 32px);
}

.footer-links a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: clamp(36px, 5.6vw, 76px);
  height: clamp(36px, 5.6vw, 76px);
  border-radius: 50%;
  background: #f7efdd;
  color: #2a2420;                 /* icon colour */
  transition: transform 0.2s ease, background 0.2s ease;
}

.footer-links a:hover,
.footer-links a:focus-visible {
  background: #eedfbd;
  transform: translateY(-3px);
  outline: none;
}

.footer-links svg {
  width: 46%;
  height: 46%;
  display: block;
}

.footer-mail {
  justify-self: end;
  font-family: "Times New Roman", Times, serif;
  font-size: clamp(13px, 1.9vw, 26px);
  color: #000;
  text-decoration: none;
  overflow-wrap: anywhere;
  text-align: right;
}

.footer-mail:hover { text-decoration: underline; }

/* Phones: slim two-row footer  (logo + icons on top, email underneath) */
@media (max-width: 700px) {
  .site-footer {
    grid-template-columns: 1fr;
    justify-items: center;
    gap: 10px;
    padding: 14px 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .footer-links { grid-column: auto; gap: 8px; }
  .footer-mail  { justify-self: center; text-align: center; font-size: 13px; }

  .footer-links a  { width: 32px; height: 32px; }
  .footer-links svg { width: 55%; height: 55%; }
}

/* ---------- Dot navigation ---------- */
.dots {
  position: fixed;
  top: 50%;
  right: max(14px, env(safe-area-inset-right));
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 10;
}

.dots a {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(240, 230, 210, 0.35);
  border: 1px solid rgba(0, 0, 0, 0.5);
  transition: transform 0.2s ease, background 0.2s ease;
}

.dots a:hover,
.dots a:focus-visible {
  background: #f0e6d2;
  transform: scale(1.4);
  outline: none;
}

/* Hide the dots on small phones so they never cover the artwork */
@media (max-width: 600px) {
  .dots { display: none; }
}

/* ---------- Accessibility ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .dots a { transition: none; }
}
  </style>
</head>
<body>

  <!-- Dot navigation -->
  <nav class="dots" aria-label="Sections">
    <a href="#home"     aria-label="Cover"></a>
    <a href="#about"    aria-label="About me"></a>
    <a href="#works"    aria-label="My works"></a>
    <a href="#projects" aria-label="Projects"></a>
    <a href="#gallery"  aria-label="Gallery"></a>
    <a href="#extra"    aria-label="More"></a>
    <a href="#contact"  aria-label="Contact"></a>
  </nav>

  <main>
    <section id="home">
      <img src="01.jpg" alt="Portfolio 2026, designed by Alfred Tennyson">
    </section>

    <section id="about">
      <img src="02.jpg" alt="About me: work experience, languages, skills and software">
    </section>

    <section id="works">
      <img src="03.jpg" alt="My Works">
    </section>

    <section id="projects">
      <img src="04.jpg" alt="Personal projects and designs on Instagram and Behance">
    </section>

    <section id="gallery">
      <img src="05.jpg" alt="Collage of photography and design work">
    </section>

    <section id="extra">
      <img src="06.jpg" alt="Animated showcase">
    </section>

    <section id="contact">
      <img src="07.jpg" alt="Let's work together: contact details">
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://www.instagram.com/humanityb4eggsnchicks?xtok=MTRidHFoZHZhbmNxeg==" target="_blank" rel="noopener noreferrer" aria-label="Instagram: humanityb4eggsnchicks" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://www.behance.net/AlfredTennyson" target="_blank" rel="noopener noreferrer" aria-label="Behance: Alfred Tennyson" title="Behance"><svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="17.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="currentColor">Bē</text></svg></a>
      <a href="https://www.instagram.com/vy0013vy?vrfl=MWI1ZTlwMGg3aHRsbw==" target="_blank" rel="noopener noreferrer" aria-label="Instagram: vy0013vy" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
    </div>

    <a class="footer-mail" href="mailto:justalfredtennyson@gmail.com">justalfredtennyson@gmail.com</a>
  </footer>

  <!-- If an image doesn't load, try other common filenames for it -->
  <script>
    document.querySelectorAll('section img').forEach(function (img) {
      var n = img.getAttribute('src').slice(0, 2);
      var tries = [
        n + '.jpg', n + '.jpeg', n + '.png', n + '.gif', n + '.webp',
        n + '_jpg.jpg', n + '_jpg.jpeg', n + '.JPG', n + '.JPEG', n + '.PNG', n + '.GIF'
      ];
      img.addEventListener('error', function () {
        var next = tries.shift();
        if (next) img.src = next;
      });
      if (img.complete && img.naturalWidth === 0) img.dispatchEvent(new Event('error'));
    });
  </script>

</body>
</html>
