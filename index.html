<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alfred's portfolio.✦ ݁</title>
  <link rel="icon" type="image/png" href="star_big.png">
  <style>
/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-snap-type: y proximity;   /* change to "mandatory" for strict slide-by-slide snapping */
  background: #000;
}

body {
  margin: 0;
  background: transparent;        /* must stay transparent or it hides the background image */
  -webkit-text-size-adjust: 100%;
}

/* ---------- Page background (fills the whole screen behind the images) ---------- */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background-color: #000;
  background-image: url("background.png"), url("download.png");  /* uses whichever file exists */
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

/* ---------- Each image = one full-screen section ---------- */
section {
  width: 100%;
  height: 100vh;
  height: 100dvh;                 /* fixes mobile browser address-bar jump */
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  scroll-snap-align: start;
}

section img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;            /* whole image always visible, nothing cropped */
  user-select: none;
  -webkit-user-drag: none;
}

/* Want the image to fill the screen edge to edge (crops a little)?
   Uncomment this block:

@media (min-width: 900px) {
  section img { object-fit: cover; }
}
*/

/* ---------- Dot navigation ---------- */
.dots {
  position: fixed;
  top: 50%;
  right: max(14px, env(safe-area-inset-right));
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 10;
}

.dots a {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(240, 230, 210, 0.35);
  border: 1px solid rgba(0, 0, 0, 0.5);
  transition: transform 0.2s ease, background 0.2s ease;
}

.dots a:hover,
.dots a:focus-visible {
  background: #f0e6d2;
  transform: scale(1.4);
  outline: none;
}

/* Hide the dots on small phones so they never cover the artwork */
@media (max-width: 600px) {
  .dots { display: none; }
}

/* ---------- Accessibility ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .dots a { transition: none; }
}
  </style>
</head>
<body>

  <!-- Dot navigation -->
  <nav class="dots" aria-label="Sections">
    <a href="#home"     aria-label="Cover"></a>
    <a href="#about"    aria-label="About me"></a>
    <a href="#works"    aria-label="My works"></a>
    <a href="#projects" aria-label="Projects"></a>
    <a href="#gallery"  aria-label="Gallery"></a>
    <a href="#extra"    aria-label="More"></a>
    <a href="#contact"  aria-label="Contact"></a>
  </nav>

  <main>
    <section id="home">
      <img src="01.jpg" alt="Portfolio 2026, designed by Alfred Tennyson">
    </section>

    <section id="about">
      <img src="02.jpg" alt="About me: work experience, languages, skills and software">
    </section>

    <section id="works">
      <img src="03.jpg" alt="My Works">
    </section>

    <section id="projects">
      <img src="04.jpg" alt="Personal projects and designs on Instagram and Behance">
    </section>

    <section id="gallery">
      <img src="05.jpg" alt="Collage of photography and design work">
    </section>

    <section id="extra">
      <img src="06.jpg" alt="Animated showcase">
    </section>

    <section id="contact">
      <img src="07.jpg" alt="Let's work together: contact details">
    </section>
  </main>

  <!-- If an image doesn't load, try other common filenames for it -->
  <script>
    document.querySelectorAll('section img').forEach(function (img) {
      var n = img.getAttribute('src').slice(0, 2);
      var tries = [
        n + '.jpg', n + '.jpeg', n + '.png', n + '.gif', n + '.webp',
        n + '_jpg.jpg', n + '_jpg.jpeg', n + '.JPG', n + '.JPEG', n + '.PNG', n + '.GIF'
      ];
      img.addEventListener('error', function () {
        var next = tries.shift();
        if (next) img.src = next;
      });
      if (img.complete && img.naturalWidth === 0) img.dispatchEvent(new Event('error'));
    });
  </script>

</body>
</html>
